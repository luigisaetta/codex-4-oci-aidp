[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-4-oci-aidp"
version = "0.1.0"
description = "Specifications and tools for OCI AI Data Platform evaluation."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aidp-python-client==4.2.1",
    "oci==2.165.1",
    "python-dotenv==1.2.3",
    "fastmcp==3.4.5",
]

[project.scripts]
aidp-mcp = "aidp_mcp.server:main"

[tool.setuptools]
packages = ["aidp_common", "aidp_mcp"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["cluster_lifecycle/tests", "catalog_tree/tests", "aidp_common/tests", "aidp_mcp/tests"]
pythonpath = [".", "cluster_lifecycle", "catalog_tree", "aidp_mcp"]
addopts = "--strict-markers"

[tool.pylint.main]
py-version = "3.11"
init-hook = "import sys; sys.path[:0] = ['.', 'cluster_lifecycle', 'catalog_tree', 'aidp_mcp']"
persistent = false

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# Explicit CLI/service parameters keep the operations visible for human review.
max-args = 10
max-locals = 25
max-branches = 18
max-statements = 70
