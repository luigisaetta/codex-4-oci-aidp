[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["cluster_lifecycle/tests", "catalog_tree/tests", "aidp_common/tests"]
pythonpath = [".", "cluster_lifecycle", "catalog_tree"]
addopts = "--strict-markers"

[tool.pylint.main]
py-version = "3.11"
init-hook = "import sys; sys.path[:0] = ['.', 'cluster_lifecycle', 'catalog_tree']"
persistent = false

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# Explicit CLI/service parameters keep the operations visible for human review.
max-args = 10
max-locals = 25
max-branches = 18
max-statements = 70
